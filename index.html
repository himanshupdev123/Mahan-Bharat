<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahan Bharat — India's Glory on Screen</title>
  <style>
    :root {
      --card-width: 220px;
      --card-height: 330px;
      --gap: 20px;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      text-align: center;
      padding: 80px 20px 50px;
      background: linear-gradient(135deg, #b91c1c, #c2410c);
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 3.8rem;
      letter-spacing: -1px;
    }

    .tagline {
      font-size: 1.5rem;
      margin: 12px 0 0;
      opacity: 0.9;
    }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .row {
      margin-bottom: 60px;
    }

    .row h2 {
      font-size: 2.1rem;
      margin: 0 0 20px 10px;
      color: #fbbf24;
      border-left: 5px solid #fbbf24;
      padding-left: 15px;
    }

    .carousel {
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE + Edge */
      display: flex;
      gap: var(--gap);
      padding: 0 10px 20px;
    }

    .carousel::-webkit-scrollbar {
      display: none;  /* Chrome, Safari, Opera */
    }

    .movie-card {
      flex: 0 0 var(--card-width);
      scroll-snap-align: start;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .movie-card:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(251, 191, 36, 0.35);
      z-index: 2;
    }

    .poster {
      width: 100%;
      height: var(--card-height);
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 14px;
    }

    .info h3 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      line-height: 1.3;
    }

    .year {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: white;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-prime { background: #00a4e3; }
    .btn-netflix { background: #e50914; }
    .btn-youtube { background: #ff0000; }
    .btn-hotstar { background: #00b4ff; }

    @media (max-width: 600px) {
      :root {
        --card-width: 160px;
        --card-height: 240px;
      }
      h1 { font-size: 2.6rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mahan Bharat</h1>
    <p class="tagline">India's Forgotten Glory on Screen</p>
  </header>

  <main>
    <!-- Row 1: Military True Stories -->
    <section class="row">
      <h2>⚔️ Military & True Battle Stories</h2>
      <div class="carousel">
        <!-- Movie cards go here -->
        <div class="movie-card">
          <img class="poster" src="https://images.justwatch.com/poster/308468278/s718/tanhaji-the-unsung-warrior.%7Bformat%7D" alt="Tanhaji">
          <div class="info">
            <h3>Tanhaji: The Unsung Warrior</h3>
            <div class="year">2020</div>
            <div class="platforms">
              <a href="#" class="btn btn-prime">Prime Video</a>
            </div>
          </div>
        </div>

        <div class="movie-card">
          <img class="poster" src="https://m.media-amazon.com/images/M/MV5BNmI4YzMyZTktMjFlYS00M2Y1LTk1ZjMtN2M0ZTVhZTAwZjQ5XkEyXkFqcGdeQXVyODE5NzE3OTE@._V1_.jpg" alt="Uri">
          <div class="info">
            <h3>Uri: The Surgical Strike</h3>
            <div class="year">2019</div>
            <div class="platforms">
              <a href="#" class="btn btn-prime">Prime Video</a>
            </div>
          </div>
        </div>

        <!-- Add 8–12 cards per row -->
      </div>
    </section>

    <!-- Row 2: Kings & Rulers -->
    <section class="row">
      <h2>👑 Kings, Warriors & Legends</h2>
      <div class="carousel">
        <!-- Similar movie cards here -->
        <div class="movie-card">
          <img class="poster" src="https://m.media-amazon.com/images/M/MV5BMTU4MjU0Njg2NV5BMl5BanBnXkFtZTgwMjA0MDM2ODE@._V1_.jpg" alt="Bajirao Mastani">
          <div class="info">
            <h3>Bajirao Mastani</h3>
            <div class="year">2015</div>
            <div class="platforms">
              <a href="#" class="btn btn-netflix">Netflix</a>
            </div>
          </div>
        </div>

        <!-- More cards... -->
      </div>
    </section>

    <!-- Add more rows as needed -->
  </main>
</body>
</html>
